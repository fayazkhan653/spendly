{% extends "base.html" %}

{% block title %}Add Expense - Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expenses.css') }}">
{% endblock %}

{% block content %}
<div class="expense-section">
    <div class="expense-container">
        <div class="expense-header">
            <h1 class="expense-title">Add New Expense</h1>
            <p class="expense-subtitle">Keep your spending in check</p>
        </div>

        <div class="expense-card">
            <form action="{{ url_for('add_expense') }}" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount" class="form-input" step="0.01" min="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" class="form-input" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" required value="{{ today }}">
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" name="description" class="form-input" rows="3" placeholder="What was this for?"></textarea>
                </div>

                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
